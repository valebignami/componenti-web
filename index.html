<meta name="robots" content="noindex, nofollow, noarchive">
<title>Componenti d'impianto</title>
<!-- Le etichette che leggono WhatsApp, Teams e la posta per costruire
     l'anteprima del link. Senza, mostrano titolo e dominio grezzi. Qui non
     va scritto niente di riservato: l'anteprima la vede chiunque riceva il
     messaggio, anche chi non ha le credenziali. -->
<meta property="og:title" content="Componenti d'impianto">
<meta property="og:description" content="Materiale interno. Per entrare servono l'email aziendale e la password.">
<meta property="og:site_name" content="Componenti">
<meta property="og:type" content="website">
<meta name="description" content="Materiale interno. Per entrare servono l'email aziendale e la password.">
<style>
  :root{
    --ground:#E6E9ED; --surface:#FFFFFF; --ink:#0F1720; --ink-soft:#54626E;
    --line:#C9D1D9; --accent:#1E6FBF; --danger:#B3261E; --danger-bg:#FCEDEC;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ground:#0C1116; --surface:#151C24; --ink:#E3E9F0; --ink-soft:#94A3B2;
           --line:#2C3844; --accent:#58A6E8; --danger:#F2B8B5; --danger-bg:#2A1614; }
  }
  *{box-sizing:border-box}
  html{color-scheme:light dark}
  body{margin:0; min-height:100dvh; display:grid; place-items:center; padding:1.5rem;
       background:var(--ground); color:var(--ink);
       font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .riquadro{width:min(26rem,100%); background:var(--surface); border:1px solid var(--line);
            border-radius:6px; padding:1.6rem 1.5rem 1.5rem;}
  h1{margin:0 0 .2rem; font-size:1.25rem; letter-spacing:-.01em}
  .sotto{margin:0 0 1.4rem; font-size:.9rem; color:var(--ink-soft)}
  label{display:block; font-size:.8rem; font-weight:600; margin:0 0 .3rem;
        letter-spacing:.02em; text-transform:uppercase; color:var(--ink-soft)}
  input{width:100%; padding:.7rem .75rem; margin:0 0 1rem; font-size:1rem;
        color:var(--ink); background:var(--ground);
        border:1px solid var(--line); border-radius:4px;}
  input:focus-visible{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent)}
  button{width:100%; min-height:2.9rem; font-size:1rem; font-weight:600; cursor:pointer;
         color:#fff; background:var(--accent); border:0; border-radius:4px}
  button[disabled]{opacity:.6; cursor:progress}
  .esito{margin:1rem 0 0; font-size:.88rem; min-height:1.4em}
  .esito.male{color:var(--danger); background:var(--danger-bg); padding:.6rem .7rem;
              border-radius:4px}
  .nota{margin:1.3rem 0 0; padding-top:1rem; border-top:1px solid var(--line);
        font-size:.78rem; line-height:1.5; color:var(--ink-soft)}
  noscript{display:block; margin-top:1rem; color:var(--danger)}
</style>
</head>
<body>
<main class="riquadro">
  <h1>Componenti d'impianto</h1>
  <p class="sotto">Materiale interno · accesso riservato</p>
  <!-- action="#" e onsubmit="return false": se il JavaScript tardasse o
     fallisse, un invio nativo porterebbe la password dentro l'indirizzo
     (?password=...), che finisce nella cronologia e nei log. Cosi' non
     puo' succedere nemmeno per un istante. -->
  <form id="modulo" action="#" onsubmit="return false" autocomplete="on">
    <label for="email">Email aziendale</label>
    <input id="email" name="email" type="email" autocomplete="username" required
           inputmode="email" autocapitalize="off" spellcheck="false">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="vai">Entra</button>
  </form>
  <p class="esito" id="esito" role="status" aria-live="polite"></p>
  <p class="nota">Il contenuto di questa pagina è cifrato. Senza le credenziali
     giuste non viene decifrato nulla: non esiste una copia in chiaro da aprire.</p>
  <noscript>Serve JavaScript attivo per decifrare la pagina.</noscript>
</main>

const byte = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esito = document.getElementById("esito");
const vai = document.getElementById("vai");

function dillo(t, male){ esito.textContent = t; esito.classList.toggle("male", !!male); }

document.getElementById("modulo").addEventListener("submit", async e => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const pw = document.getElementById("pw").value;
  vai.disabled = true;
  dillo("Sblocco in corso… ci vuole qualche secondo.");
  try {
    /* Stessa ricetta del generatore: password, a capo, email in minuscolo.
       I 600.000 giri servono a rendere lento ogni tentativo a chi provasse
       la password a forza bruta avendo scaricato la pagina. */
    const base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pw + "\n" + email), "PBKDF2", false, ["deriveKey"]);
    const chiave = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt: byte(SALE), iterations: GIRI, hash:"SHA-256" },
      base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    /* AES-GCM ha l'autenticazione dentro: se la chiave e' sbagliata, qui
       lancia un errore invece di restituire spazzatura. */
    const compresso = await crypto.subtle.decrypt(
      { name:"AES-GCM", iv: byte(IV) }, chiave, byte(CARICO));
    const flusso = new Blob([compresso]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html = await new Response(flusso).text();
    /* document.write e non innerHTML: la pagina dentro ha i suoi script, e
       con innerHTML non partirebbero. */
    document.open(); document.write(html); document.close();
  } catch (err) {
    vai.disabled = false;
    dillo("Email o password non corrette.", true);
  }
});
</script>
